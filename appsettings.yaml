# WormForaging application configuration.
#
# Read at startup by the Generic Host (see src/WormForaging.App/App.axaml.cs). This file lives at
# the repository root for ease of access; the app locates it by walking up from the executable, so
# edits here take effect on the next run without copying anything. Override the path with --config.

Serilog:
  # Minimum level written to both sinks. One of: Verbose, Debug, Information, Warning, Error, Fatal.
  # The --log-level command-line option overrides this.
  MinimumLevel: Debug
  # Directory for rolling log files, relative to this file's location (the repo root).
  LogDirectory: logs
  # Number of daily log files to keep before the oldest are deleted.
  RetainedFileCountLimit: 14

Simulation:
  # Default RNG seed for reproducible runs. The --seed command-line option overrides this; when
  # neither is set the app chooses a random seed and logs it so the run can be reproduced.
  Seed: 1

# Headless experiment runner (src/WormForaging.Harness). Each knob here is a default; the matching
# command-line option (--seeds, --base-seed, --steps, --sample, --out) overrides it. The harness runs
# every seed under all three learning modes (full, hebbian, frozen), paired by seed.
Harness:
  # Number of distinct seeds run per mode.
  Seeds: 10
  # First seed; the run uses BaseSeed .. BaseSeed+Seeds-1. Each seed fixes an identical starting
  # world/network/readout shared across the three modes, so the modes differ only by learning rule.
  BaseSeed: 1
  # Simulation steps per run.
  Steps: 20000
  # Record a time-series sample (energy, discomfort, cumulative meals) every this many steps.
  SampleInterval: 100
  # Directory the CSV files are written to, relative to this file's location (the repo root).
  OutputDirectory: results

  # Phase 2 swap-back / savings experiment (run with --experiment swap). Warm the three-factor
  # learner up on the identity mapping, then toggle the sensor->direction mapping every SegmentSteps
  # for Swaps cycles, measuring how fast it reforages each time. Shares Seeds/BaseSeed/OutputDirectory
  # above. WarmupSteps, SegmentSteps, and RecoveryWindowSteps must be whole multiples of EpochSteps.
  Swap:
    # Identity-mapping steps before the first swap (long enough to forage well).
    WarmupSteps: 20000
    # Steps between swaps.
    SegmentSteps: 20000
    # Number of swap events; they alternate Swapped, Identity, Swapped, ... so each mapping is
    # re-entered several times (the savings test needs repeated exposures).
    Swaps: 6
    # Early post-swap window whose meal count is the headline "how fast did it bounce back" scalar.
    RecoveryWindowSteps: 4000
    # Resolution of the recovery curve, and the stepping granularity.
    EpochSteps: 1000
